<!-- ============ v18.0 图标精灵 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Windows 更新 -->
  <symbol id="v18-update" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
  </symbol>
  <!-- 便笺 -->
  <symbol id="v18-sticky" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h12l4 4v12H4z"/><path d="M16 4v4h4"/><path d="M8 12h7M8 15h5"/>
  </symbol>
  <!-- 专注会话 -->
  <symbol id="v18-focus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/>
  </symbol>
  <!-- 实时字幕 -->
  <symbol id="v18-captions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 11h4M6 14h6M14 11h4M14 14h3"/>
  </symbol>
  <!-- 放大镜 -->
  <symbol id="v18-magnifier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6"/>
  </symbol>
  <!-- 投影 -->
  <symbol id="v18-project" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="13" height="9" rx="1.5"/><path d="M7 17h6M10 13v4"/><rect x="16" y="8" width="6" height="9" rx="1.5"/>
  </symbol>
  <!-- 添加/移除/排序 -->
  <symbol id="v18-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="v18-remove" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  <symbol id="v18-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="v18-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="v18-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="v18-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="v18-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
  </symbol>
  <!-- 小组件新卡图标 -->
  <symbol id="v18-photos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-4 3 2.5 2.5-2 5.5 3.5"/>
  </symbol>
  <symbol id="v18-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6 9 6 9-6"/>
  </symbol>
  <symbol id="v18-todo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 11 2 2 4-4M7 16h8"/>
  </symbol>
  <symbol id="v18-clock2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  </symbol>
  <symbol id="v18-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></symbol>
  <symbol id="v18-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
</svg>

<!-- ============ v18.0 实时字幕浮层 ============ -->
<div id="v18Captions" class="v18-cap v18-cap-bottom" hidden>
  <div class="v18-cap-bar">
    <span class="v18-cap-live"><i></i><span data-i18n="cap_listening">正在聆听…</span></span>
    <span class="v18-cap-lang" data-i18n="cap_lang">中文（简体）</span>
    <button class="v18-cap-set" id="v18CapSet" data-i18n-title="cap_settings" title="字幕设置" aria-label="settings">⚙</button>
  </div>
  <div class="v18-cap-text" id="v18CapText"></div>
  <div class="v18-cap-menu" id="v18CapMenu" hidden>
    <div class="v18-cap-row">
      <span data-i18n="cap_position">位置</span>
      <button data-cap-pos="top" data-i18n="cap_top">顶部</button>
      <button data-cap-pos="bottom" data-i18n="cap_bottom">底部</button>
    </div>
    <div class="v18-cap-row">
      <span data-i18n="cap_size">字号</span>
      <button data-cap-size="s">A</button>
      <button data-cap-size="m" class="on">A</button>
      <button data-cap-size="l">A</button>
    </div>
  </div>
</div>

<!-- ============ v18.0 放大镜控制条 ============ -->
<div id="v18MagBar" class="v18-magbar" hidden>
  <button id="v18MagOut" data-i18n-title="mag_zoom_out" title="缩小">−</button>
  <span id="v18MagVal">100%</span>
  <button id="v18MagIn" data-i18n-title="mag_zoom_in" title="放大">+</button>
  <button id="v18MagClose" data-i18n-title="mag_close" title="关闭放大镜">✕</button>
</div>

<!-- ============ v18.0 投影面板 ============ -->
<div id="v18Project" class="v18-proj" hidden>
  <div class="v18-proj-hd"><b data-i18n="proj_title">投影</b><button id="v18ProjClose" aria-label="close">✕</button></div>
  <div class="v18-proj-list">
    <button data-proj="pc"><span class="v18-proj-ic"><svg viewBox="0 0 24 24"><use href="#v18-project"/></svg></span><span data-i18n="proj_pc_only">仅电脑屏幕</span></button>
    <button data-proj="dup"><span class="v18-proj-ic"><svg viewBox="0 0 24 24"><use href="#v18-project"/></svg></span><span data-i18n="proj_duplicate">复制</span></button>
    <button data-proj="ext"><span class="v18-proj-ic"><svg viewBox="0 0 24 24"><use href="#v18-project"/></svg></span><span data-i18n="proj_extend">扩展</span></button>
    <button data-proj="sec"><span class="v18-proj-ic"><svg viewBox="0 0 24 24"><use href="#v18-project"/></svg></span><span data-i18n="proj_second">仅第二屏幕</span></button>
  </div>
  <div class="v18-proj-status" id="v18ProjStatus" data-i18n="proj_none">当前未投影</div>
</div>

<!-- ============ v18.0 第二屏幕预览 ============ -->
<div id="v18Monitor" class="v18-monitor" hidden>
  <div class="v18-mon-hd" id="v18MonDrag"><span class="v18-mon-tit"><svg viewBox="0 0 24 24"><use href="#v18-project"/></svg><span data-i18n="proj_preview">第二屏幕预览</span></span><button id="v18MonClose" aria-label="close">✕</button></div>
  <div class="v18-mon-screen" id="v18MonScreen"></div>
</div>

<!-- ============ v18.0 更新待重启横幅 ============ -->
<div id="v18UpdateBanner" class="v18-upd-banner" hidden>
  <span class="v18-ub-ic"><svg viewBox="0 0 24 24"><use href="#v18-update"/></svg></span>
  <span class="v18-ub-txt" data-i18n="upd_banner">重启以完成 Windows 18.0 更新</span>
  <button class="v18-ub-btn v18-ub-primary" id="v18UbRestart" data-i18n="upd_banner_restart">立即重启</button>
  <button class="v18-ub-btn" id="v18UbSnooze" data-i18n="upd_banner_snooze">选择时间</button>
</div>

<!-- ============ v18.0 小组件选择器 ============ -->
<div id="v18WgPicker" class="v18-wgpick" hidden>
  <div class="v18-wgp-hd"><b data-i18n="wg_picker">选择小组件</b><button id="v18WgpClose" aria-label="close">✕</button></div>
  <div class="v18-wgp-grid" id="v18WgpGrid"></div>
  <div class="v18-wgp-foot"><button class="v18-wgp-done" id="v18WgpDone" data-i18n="wg_done">完成</button></div>
</div>
