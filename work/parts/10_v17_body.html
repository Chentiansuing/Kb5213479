<!-- ============ v17.0 Copilot 侧边栏 ============ -->
<aside class="copilot" id="copilotPanel" hidden>
  <div class="cp-hd">
    <span class="cp-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#v17-copilot"/></svg></span>
    <div class="cp-hd-txt">
      <b data-i18n="cp_title">Copilot</b>
      <span class="cp-sub">Microsoft Copilot</span>
    </div>
    <button class="cp-close" id="cpClose" title="×">×</button>
  </div>
  <div class="cp-chat" id="cpChat"></div>
  <div class="cp-sug" id="cpSug">
    <div class="cp-sug-label" data-i18n="cp_suggest">试试这些</div>
    <div class="cp-chips">
      <button class="cp-chip" data-cp-send data-i18n="cp_sug_open_settings">打开设置</button>
      <button class="cp-chip" data-cp-send data-i18n="cp_sug_dark">切换深色模式</button>
      <button class="cp-chip" data-cp-send data-i18n="cp_sug_weather">今天天气怎么样</button>
      <button class="cp-chip" data-cp-send data-i18n="cp_sug_mail">帮我写封邮件</button>
      <button class="cp-chip" data-cp-send data-i18n="cp_sug_clear">清除通知</button>
    </div>
  </div>
  <div class="cp-input-row">
    <input class="cp-input" id="cpInput" data-i18n-ph="cp_ph" placeholder="向 Copilot 提问…" autocomplete="off" spellcheck="false">
    <button class="cp-send" id="cpSend" data-i18n-title="cp_send" title="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#v17-send"/></svg></button>
  </div>
</aside>

<!-- ============ v17.0 托盘隐藏图标 ============ -->
<div class="tray-flyout" id="trayFlyout" hidden>
  <div class="tf-title" data-i18n="tray_hidden">隐藏的图标</div>
  <div class="tf-grid">
    <button class="tf-icon" data-tray="onedrive" data-i18n-title="tray_onedrive" title="OneDrive — 已同步"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#v17-cloud"/></svg></button>
    <button class="tf-icon" data-tray="security" data-i18n-title="tray_security" title="Windows 安全中心 — 无操作"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#v17-shield"/></svg></button>
    <button class="tf-icon" data-tray="keyboard" data-i18n-title="tray_keyboard" title="触摸键盘"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#v17-keyboard"/></svg></button>
    <button class="tf-icon" data-tray="project" data-i18n-title="tray_project" title="投影到这台电脑"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#v17-project"/></svg></button>
  </div>
</div>

<!-- ============ v17.0 桌面图标右键菜单 ============ -->
<div class="ctx-menu ctx-icon-menu" id="ctxIconMenu" hidden>
  <button data-ictx="open" data-i18n="ctx_open">打开</button>
  <button data-ictx="pin" data-i18n="ctx_pin_start">固定到“开始”屏幕</button>
  <div class="ctx-sep"></div>
  <button data-ictx="rename" data-i18n="ctx_rename">重命名</button>
  <button data-ictx="delete" data-i18n="ctx_delete">删除</button>
  <div class="ctx-sep"></div>
  <button data-ictx="props" data-i18n="ctx_props">属性</button>
</div>

<!-- ============ v17.0 贴靠智能填充 ============ -->
<div class="snap-fill" id="snapFill" hidden>
  <div class="sf-title" data-i18n="snap_fill_title">选择要贴靠的窗口</div>
  <div class="sf-list" id="snapFillList"></div>
  <div class="sf-empty" id="snapFillEmpty" data-i18n="snap_fill_empty" hidden>没有其他可贴靠的窗口</div>
</div>

<!-- ============ v17.0 OEM 启动画面 ============ -->
<div class="boot-oem" id="bootScreen" hidden>
  <div class="bo-inner">
    <svg class="bo-logo" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#ffffff"><rect x="2" y="2" width="27" height="27" rx="1.5"/><rect x="35" y="2" width="27" height="27" rx="1.5"/><rect x="2" y="35" width="27" height="27" rx="1.5"/><rect x="35" y="35" width="27" height="27" rx="1.5"/></g>
    </svg>
    <div class="bo-spin"></div>
    <div class="bo-text" id="bootText" data-i18n="boot_preparing">正在准备 Windows</div>
    <div class="bo-brand" data-i18n="boot_oem">Windows 11 安装模拟器</div>
  </div>
</div>
