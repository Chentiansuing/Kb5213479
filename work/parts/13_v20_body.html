<!-- ============ v20.0 附近共享浮层 ============ -->
<div id="v20Nearby" class="v20-nb" hidden>
  <div class="v20-nb-head">
    <b data-i18n="nb_title">附近共享</b>
    <span class="v20-nb-vis" id="v20NbVis"></span>
    <button class="v20-x" id="v20NbClose" aria-label="close">✕</button>
  </div>
  <div class="v20-nb-scan" id="v20NbScan" hidden></div>
  <div class="v20-nb-sec" data-i18n="nb_devices">附近的设备</div>
  <div class="v20-nb-list" id="v20NbList"></div>
  <div class="v20-nb-hint" data-i18n="nb_hint">选择设备以发送文件或链接</div>
</div>

<!-- ============ v20.0 移动热点浮层 ============ -->
<div id="v20Hotspot" class="v20-hs" hidden>
  <div class="v20-hs-head">
    <span class="v20-hs-ic"><svg viewBox="0 0 24 24"><use href="#v20-hotspot"/></svg></span>
    <div><b data-i18n="hs_title">移动热点</b><span id="v20HsState" class="v20-hs-state"></span></div>
    <button class="v20-x" id="v20HsClose" aria-label="close">✕</button>
  </div>
  <div class="v20-hs-body" id="v20HsBody"></div>
</div>
